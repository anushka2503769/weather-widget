<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renaissance Singapore Weather Widget</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <!-- Classical serif typography for an antique museum look -->
  <link href="https://googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="weather-card">
    <!-- Ornate decorative corners -->
    <div class="corner top-left">✦</div>
    <div class="corner top-right">✦</div>
    <div class="corner bottom-left">✦</div>
    <div class="corner bottom-right">✦</div>
    
    <div class="card-content">
      <h1 id="location-title">SINGAPORE</h1>
      <div class="ornament">❖ ────── ❖</div>
      
      <div class="weather-details">
        <p id="temperature">--°C</p>
        <p id="condition">Gathering skies...</p>
      </div>
      
      <p id="renaissance-mood">“The canvas of the sky awaits its master.”</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
